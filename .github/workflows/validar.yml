name: validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml yamllint
      - name: Skills, manifestos, links e termos proibidos
        env:
          TERMOS_PROIBIDOS: ${{ secrets.TERMOS_PROIBIDOS }}
        run: python3 scripts/validar.py
      - name: Shell
        run: shellcheck scripts/*.sh
      - name: YAML
        run: yamllint -c .yamllint.yml .
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
