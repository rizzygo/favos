name: validar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml yamllint
      # O mesmo script que roda local: skills, prompts, shell, YAML, segredos e AGENTS.md.
      - run: scripts/validar
        env:
          TERMOS_PROIBIDOS: ${{ secrets.TERMOS_PROIBIDOS }}
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
